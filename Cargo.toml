[package]
name = "oracleagent"
version = "0.1.0"
edition = "2024"
description = "An opt-in local troubleshooting companion for Raven Linux"
license = "MIT"
repository = "https://github.com/javanhut/OracleAgent"
# `cargo run` with no `--bin` is the command line, as it always was.
default-run = "oracle"

# The checks, the rules, the model client and the prompts live in the library,
# so the command line and the desktop app are two front ends on one core
# rather than two copies of it.
[lib]
name = "oracle"
path = "src/lib.rs"

[[bin]]
name = "oracle"
path = "src/main.rs"

[[bin]]
name = "raven-oracle"
path = "src/bin/raven-oracle/main.rs"
required-features = ["gui"]

[features]
# Both interfaces are on by default and either can be compiled out. The core
# dependencies are small and pure Rust; ratatui brings a hundred-odd crates and
# GTK brings the desktop, which is a fair price for the interfaces and the
# wrong price for a minimal image that only ever runs `oracle doctor`.
default = ["tui", "gui"]
tui = ["dep:ratatui"]
gui = ["dep:gtk4", "dep:libadwaita", "dep:glib", "dep:gio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

# crossterm is used through ratatui's re-export rather than as a second direct
# dependency, so the two can never drift out of step.
ratatui = { version = "0.30.2", optional = true }

# Pinned to the same gtk-rs generation as Raven Settings, Raven Store and Raven
# Power so every Raven app resolves one set of bindings.
gtk4 = { version = "0.10", features = ["v4_12"], optional = true }
libadwaita = { version = "0.8", features = ["v1_5"], optional = true }
glib = { version = "0.21", optional = true }
gio = { version = "0.21", optional = true }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
